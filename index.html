<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="display">
        <input type="number" id="num1" placeholder="Enter num1">
        <input type="number" id="num2" placeholder="Enter num2">
        <label id="countLabel">0</label>
    </div>

    <div id="btn-cont">
        <button id="addBtn" class="buttons">
            +
        </button>
        <button id="subBtn" class="buttons">
            -
        </button>
        <button id="divBtn" class="buttons">
            /
        </button>
        <button id="mulBtn" class="buttons">
            *
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
