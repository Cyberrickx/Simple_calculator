<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cal">
        <label id="countLabel">0</label>
        <div class="display">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" placeholder="Enter num1">
            <label for="num2">Second Number:</label>
            <input type="number" id="num2" placeholder="Enter num2">
            
        </div>

        <div id="btn-cont">
            <button id="addBtn" class="buttons">
                &plus;
                Add
            </button>
            <button id="subBtn" class="buttons">
                &minus;
                Subtract
            </button>
            <button id="divBtn" class="buttons">
                &divide;
                Divide
            </button>
            <button id="mulBtn" class="buttons">
                x
                Multiply
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
