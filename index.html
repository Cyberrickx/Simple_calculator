<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ios Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <input id="display" class="display" readonly>
        <div class="keypad">
            <button onclick="clearDisplay()" class="key top" id="clear">C</button>
            <button class="key top">&plusmn;</button>
            <button onclick="appendToDisplay('%')" class="key top">&percnt;</button>
            <button onclick="appendToDisplay('/')" class="key side">&divide;</button>
            <button onclick="appendToDisplay('7')" class="key">7</button>
            <button onclick="appendToDisplay('8')" class="key">8</button>
            <button onclick="appendToDisplay('9')" class="key">9</button>
            <button onclick="appendToDisplay('*')" class="key side">&times;</button>
            <button onclick="appendToDisplay('4')" class="key">4</button>
            <button onclick="appendToDisplay('5')" class="key">5</button>
            <button onclick="appendToDisplay('6')" class="key">6</button>
            <button onclick="appendToDisplay('-')" class="key side">&minus;</button>
            <button onclick="appendToDisplay('1')" class="key">1</button>
            <button onclick="appendToDisplay('2')" class="key">2</button>
            <button onclick="appendToDisplay('3')" class="key">3</button>
            <button onclick="appendToDisplay('+')" class="key side">&plus;</button>
            <button onclick="appendToDisplay('0')" class="key special">0</button>
            <button onclick="appendToDisplay('.')" class="key">&period;</button>
            <button onclick="calculate()" class="key side">&equals;</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
